name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger (main only, see the deploy job)

permissions:
  contents: read

# One production deploy at a time, in merge order. Never cancel one mid-way:
# it may already have applied migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FLY_APP: recipevault-morning-dawn-6796
  HEALTH_URL: https://myrecipevault.io/api/health

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The deploy job's own failure notice can't fire when CI fails, because the
  # deploy job is skipped
  notify-ci-failure:
    needs: ci
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify failure
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          jq -n --arg sha "${GITHUB_SHA::7}" --arg url "$RUN_URL" \
            '{content: "🔴 **RecipeVault deploy blocked: CI failed**\nCommit: `\($sha)`\nWorkflow: \($url)"}' \
            | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

  deploy:
    needs: ci
    # A manual run can target any branch; only main may reach production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      # Build before touching the database, so a broken image can't leave the
      # schema migrated ahead of the code that is running
      - name: Build and push image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --build-only --push --local-only \
            --app "$FLY_APP" \
            --image-label "$GITHUB_SHA" \
            --build-arg VERSION="1.0.0-${GITHUB_SHA::7}" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Record the running image for rollback
        id: previous
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          image=$(flyctl status --app "$FLY_APP" --json | jq -r '.Machines[0].config.image // empty')
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Running image before this deploy: ${image:-unknown}"

      - name: Download migration SQL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: migrations-sql

      - name: Apply migrations to Supabase
        env:
          # Must be the Supavisor *session* pooler URI (port 5432). The direct
          # db.<ref>.supabase.co host is IPv6-only and GitHub runners have no IPv6;
          # the pooler has IPv4 and supports DDL in session mode.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client

          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "❌ SUPABASE_DB_URL is not set!"
            exit 1
          fi

          # The script is idempotent: it always lists every migration, and skips
          # the ones already in __EFMigrationsHistory.
          # Give up rather than queue behind live traffic if a lock is held.
          # (EF writes the script with a UTF-8 BOM, which must not end up mid-file.)
          { echo "SET lock_timeout = '10s';"; sed '1s/^\xEF\xBB\xBF//' migrations.sql; } > migrations-run.sql

          # Connect by hostname. Don't rewrite it to a resolved address: for the pooler,
          # `dig +short` returns a CNAME with a trailing dot, which TLS rejects as a
          # server name ("tlsv1 unrecognized name").
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f migrations-run.sql

          echo "✅ Migrations applied"

      - name: Deploy image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --app "$FLY_APP" \
            --image "registry.fly.io/$FLY_APP:$GITHUB_SHA" \
            --wait-timeout 5m

      # A bare 200 isn't enough: the database check is advisory, and with several
      # machines a request can land on one still running the old release. Wait
      # until the health endpoint reports this commit.
      - name: Verify deployment
        run: |
          for attempt in $(seq 1 24); do
            body=$(curl -s --max-time 10 -w '\n%{http_code}' "$HEALTH_URL" || true)
            status=$(echo "$body" | tail -n1)
            tag=$(echo "$body" | sed '$d' | jq -r '.build.tag // empty' 2>/dev/null || true)
            if [ "$status" = "200" ] && [ "$tag" = "$GITHUB_SHA" ]; then
              echo "✅ Health check passed on $tag"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status, build ${tag:-unknown}; waiting..."
            sleep 10
          done
          echo "❌ $HEALTH_URL never reported a healthy $GITHUB_SHA"
          exit 1

      - name: Rollback instructions
        if: failure() && steps.previous.outputs.image != ''
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: |
          {
            echo "### Deploy failed"
            echo "To roll back to the release that was running before this deploy:"
            echo '```bash'
            echo "fly deploy --app $FLY_APP --image $PREVIOUS_IMAGE"
            echo '```'
            echo "Migrations from this deploy may already be applied; the previous release must be compatible with them."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          title=$(printf '%s' "${COMMIT_TITLE:-$(git log -1 --pretty=%s)}" | head -n1)
          jq -n --arg sha "${GITHUB_SHA::7}" --arg title "$title" \
            '{content: "✅ **RecipeVault deployed successfully**\nCommit: `\($sha)` — \($title)\nHealth check passed."}' \
            | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"

      - name: Notify failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || exit 0
          jq -n --arg sha "${GITHUB_SHA::7}" --arg url "$RUN_URL" \
            '{content: "🔴 **RecipeVault deploy FAILED**\nCommit: `\($sha)`\nWorkflow: \($url)\n\nCheck the logs ^^^"}' \
            | curl -s -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
